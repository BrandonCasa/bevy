[package]
name = "dlss_wgpu"
version = "6.0.0"
edition = "2024"
categories = ["graphics", "rendering"]
description = "Adds support for using DLSS with wgpu"
repository = "https://github.com/bevyengine/dlss_wgpu"
documentation = "https://docs.rs/dlss_wgpu"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan"] }
ash = "0.38"
uuid = "1"
bitflags = "2"
thiserror = "2"
libloading = { version = "0.8", optional = true }

[build-dependencies]
bindgen = "0.73"
cc = "1"

[features]
debug_overlay = []
mock = []
neural_rendering = ["dep:libloading", "wgpu/wgsl"]

[[example]]
name = "neural_rendering_probe"
required-features = ["neural_rendering"]
